# eXConverter AI local settings. JVM -D options and environment variables override these values.

# Local Ollama vision model. Leave empty to auto-detect the first installed *-vl model.
exconverter.ollama.model=
exconverter.ollama.url=http://127.0.0.1:11434
# CPU-only laptops need several minutes per image; keep this generous.
exconverter.ollama.timeoutSeconds=1800
exconverter.ollama.numCtx=8192
# Longest image side sent to the model. Smaller is faster but loses small text.
exconverter.vision.maxImageSide=1280

# Optional local bridge (e.g. PaddleOCR + Qwen3-VL script) printing UI-IR JSON to stdout. Takes precedence over Ollama.
exconverter.vision.command=

# ---------------------------------------------------------------------------
# Google Gemini engine. Separate endpoint: POST /EXConverter/gemini/uploadAndGenerate.do
# The local Ollama settings above are unaffected. NOTE: this endpoint sends the design image to Google,
# and on the free tier Google uses the input to improve its products. Do not point it at confidential designs.
# API key: prefer the GEMINI_API_KEY environment variable or -Dexconverter.gemini.apiKey=... over writing it here.
exconverter.gemini.apiKey=
# Free-tier, image-capable models: gemini-3.5-flash (default), gemini-3.5-flash-lite (faster, higher quota),
# gemini-2.5-flash, gemini-2.5-flash-lite.
exconverter.gemini.model=gemini-3.5-flash
exconverter.gemini.url=https://generativelanguage.googleapis.com
# SSE streaming keeps the Eclipse console progress log and avoids read timeouts. false = one JSON response.
exconverter.gemini.stream=true
# Pin the UI-IR shape with generationConfig.responseSchema. KEEP THIS false.
# Measured 2026-09-17: with the schema attached, gemini-3.5-flash emitted the easy regions correctly and then
# collapsed into endless invented sentences exactly where the first grid's columns had to start, on 4 of 5 runs.
# With it off, responseMimeType=application/json still forces JSON and UiIrParser absorbs the shape variance.
exconverter.gemini.responseSchema=false
# Per-field description strings inside that schema make the collapse above far worse. Only meaningful when
# responseSchema=true. Field guidance lives in prompts/gemini-vision-ui-ir.txt instead.
exconverter.gemini.schemaDescriptions=false
# Thinking tokens are drawn from THIS budget too, not just the answer. A correct UI-IR measured 1,121 output
# tokens, so this is ~7x headroom. Keeping it tight makes a repetition loop fail in seconds instead of minutes;
# gemini-3.5-flash would allow up to 65000.
exconverter.gemini.maxOutputTokens=8192
# Hard character stop for a repetition loop, checked while streaming. A correct UI-IR is a few thousand
# characters. Hitting this is retried at a higher temperature, not failed outright.
exconverter.gemini.maxResponseChars=20000
# First attempt uses this temperature; retries after degenerate output walk 0.4 then 0.8, because greedy
# decoding cannot escape a repetition loop on its own.
exconverter.gemini.temperature=0
# Longest image side sent to Gemini. Billing is 258 tokens per 768x768 tile, so 1536 gives at most 4 tiles.
exconverter.gemini.maxImageSide=1536
# Thinking depth on Gemini 3.x: MINIMAL | LOW | MEDIUM | HIGH (model default is MEDIUM).
# Reading a layout is extraction, not hard reasoning, so MINIMAL keeps the output budget for the UI-IR.
# NONE (or OFF) leaves thinkingConfig out of the request entirely and lets the model use its own default.
exconverter.gemini.thinkingLevel=MINIMAL
# Legacy integer budget for models that predate thinkingLevel. -1 = do not send.
# Never sent together with thinkingLevel: the API returns 400 for that pair, so thinkingLevel wins.
exconverter.gemini.thinkingBudget=-1
exconverter.gemini.timeoutSeconds=600
exconverter.gemini.maxRetries=2
# Corporate HTTP proxy for outbound HTTPS (leave empty when not needed).
exconverter.gemini.proxyHost=
exconverter.gemini.proxyPort=8080
