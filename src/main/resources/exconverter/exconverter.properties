# eXConverter AI local settings. JVM -D options and environment variables override these values.

# Local Ollama vision model. Leave empty to auto-detect the first installed *-vl model.
exconverter.ollama.model=
exconverter.ollama.url=http://127.0.0.1:11434
# CPU-only laptops need several minutes per image; keep this generous.
exconverter.ollama.timeoutSeconds=1800
exconverter.ollama.numCtx=8192
# Longest image side sent to the model. Smaller is faster but loses small text.
exconverter.vision.maxImageSide=1280

# Optional local bridge (e.g. PaddleOCR + Qwen3-VL script) printing UI-IR JSON to stdout. Takes precedence over Ollama.
exconverter.vision.command=
